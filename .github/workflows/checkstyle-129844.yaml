# 129844 - Henrique Fernandes
name: Checkstyle gate 129844
on:
  pull_request:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle:
    name: checkstyle-129844
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129844.xml
          reporter: github-pr-check
          level: error
          fail_level: error
          filter_mode: added
