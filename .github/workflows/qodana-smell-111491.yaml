# 111491 - Tomás Leal
name: Qodana smell gate 111491
on:
  pull_request:
  push:
    branches: [main, '111491-*']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana-111491:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Qodana - Long Parameter List (111491)
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-111491.yaml
          pr-mode:  false
          use-annotations: true
          post-pr-comment: true
          upload-result: true
          artifact-name: qodana-report-111491
          primary-cache-key: qodana-111491-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-111491-${{ github.ref }}
