# 111286
name: Checkstyle Gate 111286

on:
  pull_request:
  push:
    branches: [main, '111286-*']

jobs:
  checkstyle-111286:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Checkstyle
        run: |
          curl -sL https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.14.2/checkstyle-10.14.2-all.jar -o checkstyle.jar
          java -jar checkstyle.jar -c Checkstyle/checkstyle-111286.xml src/