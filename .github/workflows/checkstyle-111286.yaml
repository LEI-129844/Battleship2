# 111286 - Eduardo Fernandes
name: Checkstyle Gate 111286

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Checkstyle
        uses: checkstyle/action-checkstyle@master
        with:
          level: 'error'
          config_xml: 'Checkstyle/checkstyle-111286.xml'
          source_dir: 'src'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
