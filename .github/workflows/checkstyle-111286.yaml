# 111286
name: Checkstyle Gate 111286

on:
  pull_request:
  push:
    branches: [main, '111286-*']

jobs:
  checkstyle-111286:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Checkstyle
        uses: checkstyle/action-checkstyle@master
        with:
          level: 'error'
          config_xml: 'Checkstyle/checkstyle-111286.xml'
          source_dir: 'src'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}