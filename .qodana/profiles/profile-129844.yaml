# 129844 - Henrique Fernandes
# Long Method (Fowler) ~ Brain Method (Lanza & Marinescu, pp. 92-93)

name: "long-method-129844"
baseProfile: empty
inspections:
  - inspection: NonCommentSourceStatements   # "Overly long method"
    enabled: true
    severity: WARNING
    options:
      m_limit: 80   # nº máximo de statements (NCSS), não linhas; omissão 30
  - inspection: CyclomaticComplexity         # "Overly complex method"
    enabled: true
    severity: WARNING
    options:
      m_limit: 40    # complexidade ciclomática máxima; omissão 10
 

